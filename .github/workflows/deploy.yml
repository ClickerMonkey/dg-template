# Auto-deploy on push — SSHes into the diffenderfer.games host, pulls, installs,
# and restarts the catalog (which rebuilds this game). It only runs when the
# deploy key is configured, so a freshly-cloned game (no secrets) just
# skips deploy instead of failing.
#
# CI_ON (repo variable, Settings → Secrets and variables → Actions → Variables;
# or a manual run's input) picks where the deploy runs:
#   self   (default) the diffenderfer-games org's self-hosted Windows runner
#          (DESKTOP-M6EK2BJ; one org-level runner serves every private repo in
#          the org — the host repo's RUNNERS.md) — SSH with Windows' own OpenSSH client; uses no
#          GitHub Actions minutes. With no runner online the job waits (up to
#          24 h) for one.
#   github GitHub-hosted ubuntu-latest via appleboy/ssh-action (a Docker action,
#          Linux only) — for when the machine is off (costs Actions minutes on
#          a private repo).
#
# Repo secrets (each repo's own; Settings → Secrets and variables → Actions,
# e.g. gh secret set DEPLOY_SSH_KEY -R diffenderfer-games/<game> < keyfile):
#   DEPLOY_SSH_KEY      private deploy key                 (required to enable)
#   DEPLOY_HOST         host or droplet IP  (optional, default: diffenderfer.games)
#   DEPLOY_USER         ssh user            (optional, default: root)
#   DEPLOY_PATH         dir on the server   (optional, default: this repo's name)
#   DEPLOY_KNOWN_HOSTS  the host's known_hosts line(s)   (optional, self-hosted
#                       deploy: else the host key is accepted on first use and
#                       remembered for that run only)
# See the host repo's ACTIONS.md for full setup.
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ci_on:
        description: "Where the deploy runs (variable: the CI_ON repo variable, else self)"
        type: choice
        options: [variable, self, github]
        default: variable

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # CI_ON=github: GitHub-hosted, appleboy/ssh-action
  deploy:
    if: ((inputs.ci_on != 'variable' && inputs.ci_on) || vars.CI_ON || 'self') == 'github'
    runs-on: ubuntu-latest
    steps:
      - name: Check for deploy secrets
        id: gate
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_SSH_KEY not set — skipping deploy."
          fi

      - name: SSH and update
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST || 'diffenderfer.games' }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "/root/${{ secrets.DEPLOY_PATH || github.event.repository.name }}"
            git fetch --all --prune
            git reset --hard "origin/$(git symbolic-ref --short HEAD)"
            npm install --no-audit --no-fund
            rm -f .diffenderfer-build-cache
            systemctl restart diffenderfer-games
            echo "deployed $(git rev-parse --short HEAD)"

  # CI_ON=self (default): on the owner's Windows runner — the same gate and
  # remote script; Windows' OpenSSH client. (Its PowerShell steps are Windows
  # PowerShell 5.1: ASCII only.)
  deploy-self:
    name: deploy (self-hosted)
    if: ((inputs.ci_on != 'variable' && inputs.ci_on) || vars.CI_ON || 'self') == 'self'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    steps:
      - name: Check for deploy secrets
        id: gate
        shell: powershell
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if ($env:KEY) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'ready=true' -Encoding ascii
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'ready=false' -Encoding ascii
            Write-Output "::notice::DEPLOY_SSH_KEY not set - skipping deploy."
          }

      - name: SSH and update (Windows OpenSSH)
        if: steps.gate.outputs.ready == 'true'
        shell: powershell
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'diffenderfer.games' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_DIR: /root/${{ secrets.DEPLOY_PATH || github.event.repository.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          # the key, this user's only (OpenSSH refuses a key others can read; full control, so it can be deleted)
          $dir = Join-Path $env:RUNNER_TEMP 'deploy-ssh'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $key = Join-Path $dir 'id'
          [IO.File]::WriteAllText($key, ($env:DEPLOY_SSH_KEY -replace "`r", '').Trim() + "`n")
          icacls $key /inheritance:r /grant:r "$($env:USERNAME):(F)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls failed on the key file" }
          # known hosts: DEPLOY_KNOWN_HOSTS if set (strict), else accept the host's key on first use (this run only)
          $kh = Join-Path $dir 'known_hosts'
          if ($env:DEPLOY_KNOWN_HOSTS) {
            [IO.File]::WriteAllText($kh, ($env:DEPLOY_KNOWN_HOSTS -replace "`r", '').Trim() + "`n"); $strict = 'yes'
          } else {
            [IO.File]::WriteAllText($kh, ''); $strict = 'accept-new'
          }
          # the remote script (the same as the GitHub-hosted deploy's), sent base64-encoded: no quoting / CRLF trouble
          $script = @'
          set -euo pipefail
          cd "__DEPLOY_DIR__"
          git fetch --all --prune
          git reset --hard "origin/$(git symbolic-ref --short HEAD)"
          npm install --no-audit --no-fund
          rm -f .diffenderfer-build-cache
          systemctl restart diffenderfer-games
          echo "deployed $(git rev-parse --short HEAD)"
          '@
          $script = ($script -replace "`r", '').Replace('__DEPLOY_DIR__', $env:DEPLOY_DIR) + "`n"
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          $ssh = Join-Path $env:WINDIR 'System32\OpenSSH\ssh.exe'
          if (-not (Test-Path $ssh)) { $ssh = (Get-Command ssh.exe).Source }
          & $ssh -i $key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=30 -o "StrictHostKeyChecking=$strict" -o "UserKnownHostsFile=$kh" "$($env:DEPLOY_USER)@$($env:DEPLOY_HOST)" "echo $b64 | base64 -d | bash"
          if ($LASTEXITCODE -ne 0) { throw "the deploy over ssh failed (exit $LASTEXITCODE)" }

      - name: Delete the key
        if: always()
        shell: powershell
        run: |
          Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'deploy-ssh') -ErrorAction SilentlyContinue
          exit 0
