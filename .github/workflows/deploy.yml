# Auto-deploy on push: SSHes into the diffenderfer.games host, pulls, installs,
# and asks the host to rebuild only this game. It only runs when the deploy key
# is configured, so a freshly-created game (no secrets) just skips the deploy
# instead of failing.
#
# Where it runs: the diffenderfer-games org's self-hosted Windows runner
# (DESKTOP-M6EK2BJ; one org-level runner serves every private repo in the org,
# see the host repo's RUNNERS.md). GitHub-hosted runners are not used. With no
# runner online the job waits (up to 24 h) for one.
#
# Safeguards (the runner runs whatever a workflow says, on the owner's machine):
#   - triggers: push to the default branch and manual runs only; never add
#     pull_request / pull_request_target or any trigger a fork can fire;
#   - the job's if: refuses anything but a push / manual run on the default
#     branch of a diffenderfer-games repo;
#   - it never runs in the public template (diffenderfer-games/dg-template);
#     games copied from it are private repos, where the same file deploys.
#
# Repo secrets (each repo's own; Settings > Secrets and variables > Actions,
# e.g. gh secret set DEPLOY_SSH_KEY -R diffenderfer-games/<game> < keyfile):
#   DEPLOY_SSH_KEY      private deploy key                 (required to enable)
#   DEPLOY_HOST         host or droplet IP  (optional, default: diffenderfer.games)
#   DEPLOY_USER         ssh user            (optional, default: root)
#   DEPLOY_PATH         dir on the server, under /root (optional, default: this repo's name)
#   DEPLOY_KNOWN_HOSTS  the host's known_hosts line(s)   (optional: else the host
#                       key is accepted on first use and remembered for that run only)
# Repo variable (optional): DEPLOY_SLUG, the catalog slug (default: the repo
# name, lowercased), the name of the link in the host's apps/ folder.
#
# First deploy: when the server has no clone yet, the remote script clones the
# repo (the droplet's gh login authenticates private org repos), installs it,
# and links it into /root/diffenderfer-games/apps/<slug>, so a new game goes
# live on its first push. Later deploys pull, install and rebuild as before.
# See the host repo's ACTIONS.md for full setup.
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # On the owner's self-hosted Windows runner (DESKTOP-M6EK2BJ), Windows' OpenSSH
  # client. (Its PowerShell steps are Windows PowerShell 5.1: ASCII only.)
  deploy-self:
    name: deploy (self-hosted)
    # Push-only guard: only a push / manual run on the default branch of a repo in
    # the diffenderfer-games org; never the public template itself (it must not
    # run on any runner).
    if: >-
      github.repository != 'diffenderfer-games/dg-template' &&
      github.repository_owner == 'diffenderfer-games' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    steps:
      - name: Check for deploy secrets
        id: gate
        shell: powershell
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if ($env:KEY) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'ready=true' -Encoding ascii
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'ready=false' -Encoding ascii
            Write-Output "::notice::DEPLOY_SSH_KEY not set - skipping deploy."
          }

      - name: SSH and update (Windows OpenSSH)
        if: steps.gate.outputs.ready == 'true'
        shell: powershell
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'diffenderfer.games' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_DIR: /root/${{ secrets.DEPLOY_PATH || github.event.repository.name }}
          DEPLOY_REPO: ${{ github.repository }}
          DEPLOY_SLUG: ${{ vars.DEPLOY_SLUG || github.event.repository.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          # the key, this user's only (OpenSSH refuses a key others can read; full control, so it can be deleted)
          $dir = Join-Path $env:RUNNER_TEMP 'deploy-ssh'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $key = Join-Path $dir 'id'
          [IO.File]::WriteAllText($key, ($env:DEPLOY_SSH_KEY -replace "`r", '').Trim() + "`n")
          icacls $key /inheritance:r /grant:r "$($env:USERNAME):(F)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls failed on the key file" }
          # known hosts: DEPLOY_KNOWN_HOSTS if set (strict), else accept the host's key on first use (this run only)
          $kh = Join-Path $dir 'known_hosts'
          if ($env:DEPLOY_KNOWN_HOSTS) {
            [IO.File]::WriteAllText($kh, ($env:DEPLOY_KNOWN_HOSTS -replace "`r", '').Trim() + "`n"); $strict = 'yes'
          } else {
            [IO.File]::WriteAllText($kh, ''); $strict = 'accept-new'
          }
          # the remote script, sent base64-encoded: no quoting / CRLF trouble
          $script = @'
          set -euo pipefail
          REPO="__REPO__"
          DIR="__DEPLOY_DIR__"
          SLUG="__SLUG__"
          APPS=/root/diffenderfer-games/apps
          if [ ! -d "$DIR/.git" ]; then
            echo "first deploy: cloning $REPO into $DIR"
            git clone "https://github.com/$REPO.git" "$DIR"
          fi
          cd "$DIR"
          git fetch --all --prune
          git reset --hard "origin/$(git symbolic-ref --short HEAD)"
          npm install --no-audit --no-fund
          rm -f .diffenderfer-build-cache
          SLUG="$(printf '%s' "$SLUG" | tr '[:upper:]' '[:lower:]')"
          if ! printf '%s' "$SLUG" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then echo "bad slug: $SLUG" >&2; exit 1; fi
          if [ -L "$APPS/$SLUG" ] || [ -e "$APPS/$SLUG" ]; then
            [ "$(readlink -f "$APPS/$SLUG")" = "$(readlink -f "$DIR")" ] || echo "::warning::$APPS/$SLUG exists but isn't this repo; left as is"
          else
            ln -s "$DIR" "$APPS/$SLUG"
            echo "linked $APPS/$SLUG -> $DIR"
          fi
          # Rebuild and restart only this game on dg-host (loopback only; blocks until built, up to 10 min).
          # Prints the JSON report; a non-2xx answer (500 = broken, 503 = host still booting) fails the deploy.
          # Fallback if ever needed: systemctl restart diffenderfer-games (the compat shim: restarts dg-host + dg-hub, ~15 s for every game).
          curl --fail-with-body -sS -X POST --max-time 600 "http://127.0.0.1:8080/_host/rebuild/$SLUG"; echo
          echo "deployed $(git rev-parse --short HEAD)"
          '@
          $script = ($script -replace "`r", '').Replace('__DEPLOY_DIR__', $env:DEPLOY_DIR).Replace('__REPO__', $env:DEPLOY_REPO).Replace('__SLUG__', $env:DEPLOY_SLUG) + "`n"
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          $ssh = Join-Path $env:WINDIR 'System32\OpenSSH\ssh.exe'
          if (-not (Test-Path $ssh)) { $ssh = (Get-Command ssh.exe).Source }
          & $ssh -i $key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=30 -o "StrictHostKeyChecking=$strict" -o "UserKnownHostsFile=$kh" "$($env:DEPLOY_USER)@$($env:DEPLOY_HOST)" "echo $b64 | base64 -d | bash"
          if ($LASTEXITCODE -ne 0) { throw "the deploy over ssh failed (exit $LASTEXITCODE)" }

      - name: Delete the key
        if: always()
        shell: powershell
        run: |
          Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'deploy-ssh') -ErrorAction SilentlyContinue
          exit 0
